<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Блатные номера</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
:root{--bg:#0e1320;--panel:#171e30;--line:#26304a;--ink:#e9edf7;--mute:#8b95ad;--com:#8b95ad;--rare:#4aa3ff;--epic:#b277ff;--leg:#ffc247;--btn:#e9edf7;--btnink:#0e1320;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef1f7;--panel:#fff;--line:#d8deea;--ink:#141a2b;--mute:#5c667d;--com:#5c667d;--rare:#1f78d1;--epic:#8040d6;--leg:#a86a00;--btn:#141a2b;--btnink:#fff}}
:root[data-theme="dark"]{--bg:#0e1320;--panel:#171e30;--line:#26304a;--ink:#e9edf7;--mute:#8b95ad}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;max-width:520px;margin-inline:auto;padding:14px 14px 40px}
h2{font-size:15px;font-weight:500;color:var(--mute);margin:22px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bal{font-size:26px;font-weight:700}
.bal small{font-size:13px;font-weight:400;color:var(--mute);margin-left:4px}
.bonus{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px}
.bonus:disabled{color:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:6px 13px;font:inherit;font-size:13px}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.plate{margin-top:10px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:22px 12px;text-align:center;transition:border-color .3s,box-shadow .3s}
.plate .op{font-size:13px;color:var(--mute);min-height:18px}
.plate .num{font-size:clamp(24px,8vw,36px);font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin:6px 0;white-space:nowrap}
.plate .tier{font-size:14px;font-weight:500;min-height:20px}
.plate.rare{border-color:var(--rare);box-shadow:0 0 24px color-mix(in srgb,var(--rare) 35%,transparent)}
.plate.epic{border-color:var(--epic);box-shadow:0 0 28px color-mix(in srgb,var(--epic) 40%,transparent)}
.plate.leg{border-color:var(--leg);box-shadow:0 0 36px color-mix(in srgb,var(--leg) 55%,transparent)}
.t-com{color:var(--com)}.t-rare{color:var(--rare)}.t-epic{color:var(--epic)}.t-leg{color:var(--leg)}
.spins{display:grid;gap:8px;margin-top:12px}
.spin{display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-left-width:5px;border-radius:14px;padding:12px 14px;color:var(--ink);font:inherit;width:100%}
.spin b{font-size:16px;font-weight:700}
.spin span{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.spin em{font-style:normal;font-weight:700;font-size:16px;white-space:nowrap}
.spin[data-k="rare"]{border-left-color:var(--rare)}.spin[data-k="epic"]{border-left-color:var(--epic)}.spin[data-k="leg"]{border-left-color:var(--leg)}
.spin:disabled{opacity:.45}
.spin:active:not(:disabled){transform:scale(.985)}
.inv{display:grid;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.item b{font-variant-numeric:tabular-nums;font-weight:500}
.item small{display:block;font-size:12px;color:var(--mute)}
.sell{border:1px solid var(--line);background:none;color:var(--ink);border-radius:9px;padding:6px 10px;font:inherit;font-size:13px;white-space:nowrap}
.row{display:flex;justify-content:space-between;align-items:center}
.empty{color:var(--mute);padding:10px 0}
.stat{color:var(--mute);font-size:13px;margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <div class="bal"><span id="bal">0</span><small>монет</small></div>
  <button class="bonus" id="bonus">Бонус +5 000</button>
</div>

<div class="chips" id="ops" role="group" aria-label="Оператор"></div>

<div class="plate" id="plate" aria-live="polite">
  <div class="op" id="pop">Выбери крутку</div>
  <div class="num" id="pnum">+7 (9••) •••-••-••</div>
  <div class="tier" id="ptier"></div>
</div>

<div class="spins" id="spins"></div>

<div class="row"><h2>Коллекция</h2><button class="sell" id="sellCom">Продать обычные</button></div>
<div class="inv" id="inv"></div>
<div class="stat" id="stat"></div>

<script>
const OPS={'МТС':['910','911','915','916','917','919','980','985','986','988'],'Билайн':['903','905','906','909','960','963','964','965','967','968'],'МегаФон':['920','921','925','926','929','931','933','937'],'Теле2':['950','951','952','953','977','900'],'Yota':['999','995']};
const TIERS=[{n:'Обычный',c:'com',v:100},{n:'Редкий',c:'rare',v:700},{n:'Эпический',c:'epic',v:7000},{n:'Легендарный',c:'leg',v:40000}];
const SPINS=[
 {k:'rare',name:'Редкая крутка',cost:1000,w:[60,34,5.5,.5]},
 {k:'epic',name:'Эпическая крутка',cost:10000,w:[25,45,27,3]},
 {k:'leg',name:'Легендарная крутка',cost:50000,w:[5,25,50,20]}
];
const R=n=>Math.floor(Math.random()*n), d=()=>''+R(10), rd=n=>Array.from({length:n},d).join(''), pick=a=>a[R(a.length)];
const GEN=[
 ()=>rd(7),
 [()=>rd(3)+d().repeat(4),()=>{const a=d(),b=d();return rd(3)+a+a+b+b},()=>{const a=d(),b=d();return rd(3)+a+b+a+b},()=>d().repeat(3)+rd(4),()=>rd(4)+'000'],
 [()=>rd(2)+d().repeat(5),()=>{const a=d(),b=d();return d()+(a+b).repeat(3)},()=>{const s=R(6);return rd(2)+'0123456789'.slice(s,s+5)},()=>{const h=rd(3);return h+d()+[...h].reverse().join('')}],
 [()=>d().repeat(7),()=>{const s=1+R(3);return '123456789'.slice(s-1,s+6)},()=>(1+R(9))+'000000']
];
const gen=t=>t===0?GEN[0]():pick(GEN[t])();
const fmt=(p,s)=>`+7 (${p}) ${s.slice(0,3)}-${s.slice(3,5)}-${s.slice(5)}`;
const nf=n=>n.toLocaleString('ru-RU');
let S={bal:25000,inv:[],spins:0,best:0,bonusAt:0,id:1};
try{const r=localStorage.getItem('nomera_v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('nomera_v1',JSON.stringify(S))}catch(e){}};
let op='Любой',busy=false;

function drawOps(){
  const box=$('#ops');box.innerHTML='';
  ['Любой',...Object.keys(OPS)].forEach(o=>{
    const b=document.createElement('button');b.className='chip';b.textContent=o;b.setAttribute('aria-pressed',o===op);
    b.onclick=()=>{op=o;drawOps()};box.appendChild(b)});
}
function $(s){return document.querySelector(s)}
function drawSpins(){
  const box=$('#spins');box.innerHTML='';
  SPINS.forEach((s,i)=>{
    const b=document.createElement('button');b.className='spin';b.dataset.k=s.k;b.disabled=busy||S.bal<s.cost;
    const top=s.w[3],ep=s.w[2];
    b.innerHTML=`<div><b>${s.name}</b><span>эпик ${ep}% · легенда ${top}%</span></div><em>${nf(s.cost)}</em>`;
    b.onclick=()=>spin(i);box.appendChild(b)});
}
function drawInv(){
  const box=$('#inv');
  const list=[...S.inv].sort((a,b)=>b.t-a.t||b.id-a.id).slice(0,60);
  $('#bal').textContent=nf(S.bal);
  $('#sellCom').style.display=S.inv.some(x=>x.t===0)?'':'none';
  if(!list.length){box.innerHTML='<div class="empty">Пока пусто. Сделай первую крутку.</div>'}
  else box.innerHTML=list.map(x=>`<div class="item"><div><b class="t-${TIERS[x.t].c}">${x.num}</b><small>${x.op} · ${TIERS[x.t].n}</small></div><button class="sell" data-id="${x.id}">Продать ${nf(TIERS[x.t].v)}</button></div>`).join('');
  box.querySelectorAll('.sell').forEach(b=>b.onclick=()=>{
    const it=S.inv.find(x=>x.id==b.dataset.id);if(!it)return;
    S.bal+=TIERS[it.t].v;S.inv=S.inv.filter(x=>x!==it);refresh()});
  $('#stat').textContent=`Круток: ${S.spins}. Лучший номер: ${S.best?TIERS[S.best].n:'пока нет'}.`;
  const left=Math.max(0,S.bonusAt-Date.now());
  $('#bonus').disabled=left>0;
  $('#bonus').textContent=left>0?`Бонус через ${Math.ceil(left/1000)} с`:'Бонус +5 000';
}
function refresh(){save();drawSpins();drawInv()}
function weighted(w){let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<w.length;i++){if((r-=w[i])<0)return i}return 0}

function spin(i){
  const s=SPINS[i];if(busy||S.bal<s.cost)return;
  busy=true;S.bal-=s.cost;S.spins++;
  const t=weighted(s.w);
  const o=op==='Любой'?pick(Object.keys(OPS)):op;
  const pre=pick(OPS[o]),tail=gen(t),final=fmt(pre,tail);
  const plate=$('#plate');plate.className='plate';$('#ptier').textContent='';$('#pop').textContent=o;
  $('#bal').textContent=nf(S.bal);drawSpins();
  const start=Date.now();
  const tick=setInterval(()=>{
    const p=Date.now()-start,fixed=Math.floor(p/180); // цифры замирают слева направо
    $('#pnum').textContent=fmt(pre,tail.slice(0,Math.min(fixed,7))+rd(7).slice(0,7-Math.min(fixed,7)));
    if(p>1400){
      clearInterval(tick);
      $('#pnum').textContent=final;
      const T=TIERS[t];plate.className='plate '+(t?T.c:'');
      $('#ptier').className='tier t-'+T.c;$('#ptier').textContent=T.n+' номер';
      S.inv.push({id:S.id++,num:final,op:o,t});if(t>S.best)S.best=t;
      busy=false;refresh();
      try{navigator.vibrate&&t>1&&navigator.vibrate(t===3?[60,40,60,40,120]:40)}catch(e){}
    }
  },60);
}
$('#bonus').onclick=()=>{if(Date.now()<S.bonusAt)return;S.bal+=5000;S.bonusAt=Date.now()+300000;refresh()};
$('#sellCom').onclick=()=>{const c=S.inv.filter(x=>x.t===0);S.bal+=c.length*TIERS[0].v;S.inv=S.inv.filter(x=>x.t!==0);refresh()};
try{window.Telegram&&Telegram.WebApp&&(Telegram.WebApp.ready(),Telegram.WebApp.expand())}catch(e){}
setInterval(()=>{if(S.bonusAt>Date.now())drawInv()},1000);
drawOps();refresh();
</script>
</body>
</html>
