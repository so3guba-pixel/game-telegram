<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Блатные номера РФ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#090b10;--panel:#121620;--panel2:#191e2a;--line:#293142;
  --text:#f6f7fb;--muted:#8d97aa;--red:#ef3340;--gold:#ffc857;
  --green:#51d88a;--blue:#64c7ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
body{min-height:100vh;user-select:none;padding-bottom:24px}
button{border:0;color:inherit;font:inherit;cursor:pointer}
.app{width:min(100%,680px);margin:auto;padding:env(safe-area-inset-top) 14px 20px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 14px}
.profile{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;background:#2c3548;display:grid;place-items:center;font-weight:800;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.icon{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.balance{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#211d27,#151922);border:1px solid #3b3040;padding:16px;border-radius:14px;margin-bottom:14px}
.balance small{color:var(--muted);display:block;margin-bottom:4px}.money{font-size:25px;font-weight:900;color:var(--gold)}
.bonus{background:#25200f;color:#ffd96b;border:1px solid #66521a;border-radius:10px;padding:10px 12px;font-weight:800;font-size:12px}
.section-title{font-size:17px;font-weight:900;margin:22px 0 10px}
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.case{position:relative;text-align:left;min-height:150px;padding:12px;border-radius:13px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.case:before{content:"";position:absolute;width:90px;height:90px;right:-30px;top:-30px;border-radius:50%;background:var(--c);opacity:.13}
.case h3{margin:0 0 8px;font-size:14px}.case p{font-size:11px;color:var(--muted);line-height:1.35;margin:0 0 14px}
.price{font-weight:900;color:var(--gold);font-size:14px}.case button{position:absolute;left:10px;right:10px;bottom:10px;padding:9px;background:var(--c);color:#080a0e;border-radius:8px;font-weight:900;font-size:12px}
.rare{--c:#7fa7ff}.epic{--c:#c084fc}.legendary{--c:#ffc857}
.roulette{display:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;overflow:hidden}
.track-wrap{height:120px;position:relative;overflow:hidden;border-radius:10px;background:#0d1017}
.track{height:100%;display:flex;align-items:center;gap:8px;will-change:transform}
.pointer{position:absolute;z-index:2;left:50%;top:0;bottom:0;width:3px;background:var(--red);box-shadow:0 0 12px var(--red)}
.pointer:before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top-color:var(--red)}
.ticket{flex:0 0 104px;height:82px;border:1px solid var(--line);border-radius:9px;background:#171c26;text-align:center;padding:10px 4px}
.ticket b{display:block;font-size:12px;margin:6px 0}.ticket small{color:var(--muted);font-size:10px}.ticket.rare{border-color:#5472b1}.ticket.epic{border-color:#8b5eb9}.ticket.legendary{border-color:#a98226}
.rolling{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
.inventory{display:grid;gap:8px}.item{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px}
.item-main{min-width:0}.number{font-weight:900;letter-spacing:.3px}.operator{font-size:11px;color:var(--muted);margin-top:4px}
.badge{display:inline-block;font-size:10px;font-weight:900;padding:4px 7px;border-radius:6px;margin-right:6px}.badge.rare{background:#263a68;color:#9bb9ff}.badge.epic{background:#45215f;color:#dda7ff}.badge.legendary{background:#584313;color:#ffd96b}
.item-actions{display:flex;align-items:center;gap:8px}.sell{background:#242b38;color:#dce3f0;border-radius:7px;padding:8px;font-size:11px;font-weight:800}
.filters{display:flex;gap:6px;overflow:auto;padding-bottom:2px}.filter{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 11px;color:var(--muted);font-size:12px}.filter.active{color:#fff;border-color:var(--red);background:#30151a}
.empty{text-align:center;color:var(--muted);padding:25px;background:var(--panel);border-radius:10px}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:10;align-items:end;justify-content:center}.modal.open{display:flex}
.sheet{width:min(100%,680px);background:#151a24;border:1px solid var(--line);border-radius:18px 18px 0 0;padding:22px 16px calc(20px + env(safe-area-inset-bottom));text-align:center}
.sheet h2{margin:0 0 7px}.won-number{font-size:25px;font-weight:950;margin:20px 0 8px}.won-value{color:var(--gold);font-size:18px;font-weight:900}.sheet-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}.primary,.secondary{padding:13px;border-radius:9px;font-weight:900}.primary{background:var(--red)}.secondary{background:#2a3240}
.top-actions{display:flex;align-items:center;justify-content:space-between}
.sell-all{background:#302027;color:#ff9ca2;border:1px solid #63343b;padding:8px 10px;border-radius:8px;font-size:11px;font-weight:800}
@media(max-width:390px){.case{min-height:155px;padding:10px 8px}.case button{left:7px;right:7px}.money{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="profile">
    <div class="avatar" id="avatar">РФ</div>
    <div><div class="name" id="userName">Игрок</div><div class="sub">Коллекция номеров</div></div>
  </div>
  <button class="icon" id="soundBtn" title="Звук">🔊</button>
</header>

<section class="balance">
  <div><small>Баланс</small><div class="money"><span id="balance">15 000</span> ₽</div></div>
  <button class="bonus" id="bonusBtn">+5 000 ₽</button>
</section>

<div class="roulette" id="roulette">
  <div class="track-wrap"><div class="pointer"></div><div class="track" id="track"></div></div>
  <div class="rolling" id="rolling">Определяем номер...</div>
</div>

<div class="section-title">Открыть кейс</div>
<div class="cases">
  <div class="case rare"><h3>Редкий</h3><p>75% редких<br>22% эпических<br>3% легендарных</p><div class="price">1 000 ₽</div><button data-case="rare">Крутить</button></div>
  <div class="case epic"><h3>Эпический</h3><p>20% редких<br>65% эпических<br>15% легендарных</p><div class="price">10 000 ₽</div><button data-case="epic">Крутить</button></div>
  <div class="case legendary"><h3>Легендарный</h3><p>45% эпических<br>55% легендарных</p><div class="price">50 000 ₽</div><button data-case="legendary">Крутить</button></div>
</div>

<div class="top-actions"><div class="section-title">Инвентарь</div><button class="sell-all" id="sellAll">Продать все</button></div>
<div class="filters">
  <button class="filter active" data-filter="all">Все</button>
  <button class="filter" data-filter="rare">Редкие</button>
  <button class="filter" data-filter="epic">Эпические</button>
  <button class="filter" data-filter="legendary">Легендарные</button>
</div>
<div class="inventory" id="inventory"></div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2>Новый номер</h2>
    <div class="won-number" id="wonNumber"></div>
    <div id="wonMeta"></div>
    <div class="won-value" id="wonValue"></div>
    <div class="sheet-buttons">
      <button class="secondary" id="keepBtn">В коллекцию</button>
      <button class="primary" id="sellBtn">Продать сразу</button>
    </div>
  </div>
</div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand()}
const $=s=>document.querySelector(s), money=n=>n.toLocaleString("ru-RU");
const KEY="blatnye_numbers_v1";
let state=JSON.parse(localStorage.getItem(KEY)||'{"balance":15000,"inventory":[],"bonus":0}');
let sound=true,audio=null,current=null,filter="all";

const operators=[
 ["МТС",["910","915","916","985"],"#ed1b2f"],
 ["Билайн",["903","905","906","909","963"],"#ffd400"],
 ["МегаФон",["925","926","929","936"],"#54c878"],
 ["Tele2",["901","958","977","999"],"#f1f1f1"],
 ["Yota",["995","996","999"],"#62c9f3"]
];
const patterns={
 rare:["pair","mirror","triple"],epic:["quad","mirrorfull","zeros","ladder"],
 legendary:["seven","million","six","gold"]
};
const prices={rare:[500,1900],epic:[6500,15000],legendary:[40000,150000]};
const names={rare:"Редкий",epic:"Эпический",legendary:"Легендарный"};

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function haptic(type="light"){try{tg?.HapticFeedback?.impactOccurred(type)}catch(e){}}
function beep(freq=500,duration=.045){
 if(!sound)return;
 audio??=new (window.AudioContext||window.webkitAudioContext)();
 const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type="sine";g.gain.value=.035;
 o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.stop(audio.currentTime+duration)
}
function winSound(){[523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.16),i*100))}
function rnd(n){return Math.floor(Math.random()*n)}
function digits(n){return String(n).padStart(2,"0")}
function makeNumber(rarity){
 const op=operators[rnd(operators.length)], def=op[1][rnd(op[1].length)], p=patterns[rarity][rnd(patterns[rarity].length)];
 let a,b,c,d;
 if(p==="pair"){a=rnd(900)+100;b=rnd(90)+10;d=digits(b)}
 if(p==="mirror"){a=rnd(900)+100; b=rnd(90)+10; d=String(a).slice(0,2)}
 if(p==="triple"){a=String(rnd(8)+1).repeat(3);b=rnd(90)+10;d=rnd(90)+10}
 if(p==="quad"){a=rnd(900)+100;b=String(rnd(90)+10);d=b}
 if(p==="mirrorfull"){a="123";b="45";d="23"}
 if(p==="zeros"){a=String(rnd(8)+1)+"00";b="00";d=digits(rnd(90))}
 if(p==="ladder"){a="123";b="45";d="67"}
 if(p==="seven"){a=String(rnd(8)+1).repeat(3);b=String(rnd(8)+1).repeat(2);d=String(rnd(8)+1).repeat(2)}
 if(p==="million"){a="100";b="00";d="00"}
 if(p==="six"){a=String(rnd(8)+1).repeat(3);b=String(rnd(8)+1).repeat(2);d=String(rnd(8)+1)+"0"}
 if(p==="gold"){a="777";b="00";d="00"}
 const value=prices[rarity][0]+rnd(prices[rarity][1]-prices[rarity][0]+1);
 return {id:Date.now()+Math.random(),operator:op[0],color:op[2],def,a,b,d,rarity,value}
}
function formatted(x){return `+7 (${x.def}) ${x.a}-${x.b}-${x.d}`}
function render(){
 $("#balance").textContent=money(state.balance);renderInventory();
 const u=tg?.initDataUnsafe?.user;
 if(u){$("#userName").textContent=[u.first_name,u.last_name].filter(Boolean).join(" ");if(u.photo_url)$("#avatar").innerHTML=`<img src="${u.photo_url}">`;else $("#avatar").textContent=(u.first_name||"И")[0]}
}
function renderInventory(){
 const list=state.inventory.filter(x=>filter==="all"||x.rarity===filter);
 $("#inventory").innerHTML=list.length?list.map(x=>`<div class="item"><div class="item-main"><div class="number">${formatted(x)}</div><div class="operator"><span class="badge ${x.rarity}">${names[x.rarity]}</span>${money(x.value)} ₽ · ${x.operator}</div></div><div class="item-actions"><button class="sell" data-sell="${x.id}">Продать</button></div></div>`).join(""):`<div class="empty">Коллекция пока пуста</div>`;
 document.querySelectorAll("[data-sell]").forEach(b=>b.onclick=()=>sell(b.dataset.sell));
}
function choose(caseName){
 const cost={rare:1000,epic:10000,legendary:50000}[caseName];
 if(state.balance<cost){alert("Недостаточно средств");return}
 state.balance-=cost;save();render();haptic("medium");
 const roll=Math.random()*100;let rarity;
 if(caseName==="rare")rarity=roll<75?"rare":roll<97?"epic":"legendary";
 if(caseName==="epic")rarity=roll<20?"rare":roll<85?"epic":"legendary";
 if(caseName==="legendary")rarity=roll<45?"epic":"legendary";
 current=makeNumber(rarity);startRoulette(current)
}
function startRoulette(prize){
 $("#roulette").style.display="block";$("#rolling").textContent="Крутится...";
 const track=$("#track");track.innerHTML="";
 const items=Array.from({length:45},(_,i)=>i===35?prize:makeNumber(i%7===0?"legendary":i%3===0?"epic":"rare"));
 items.forEach(x=>{const e=document.createElement("div");e.className=`ticket ${x.rarity}`;e.innerHTML=`<small>${x.operator}</small><b>${x.def}</b><small>${x.a}-${x.b}-${x.d}</small>`;track.appendChild(e)});
 track.style.transition="none";track.style.transform="translateX(0)";
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
   const card=track.children[35], target=card.offsetLeft+card.offsetWidth/2-track.parentElement.clientWidth/2+(Math.random()*30-15);
   track.style.transition="transform 4.2s cubic-bezier(.08,.78,.13,1)";
   track.style.transform=`translateX(-${target}px)`;
   let ticks=0;const timer=setInterval(()=>{beep(360+ticks%2*100);haptic("light");if(++ticks>17)clearInterval(timer)},220);
   setTimeout(()=>{winSound();haptic("heavy");showPrize(prize)},4500)
 }))
}
function showPrize(x){$("#wonNumber").textContent=formatted(x);$("#wonMeta").innerHTML=`<span class="badge ${x.rarity}">${names[x.rarity]}</span>${x.operator}`;$("#wonValue").textContent=`Оценка: ${money(x.value)} ₽`;$("#modal").classList.add("open")}
function closePrize(){current=null;$("#modal").classList.remove("open");$("#roulette").style.display="none"}
function sell(id){const i=state.inventory.findIndex(x=>String(x.id)===String(id));if(i<0)return;state.balance+=state.inventory[i].value;state.inventory.splice(i,1);save();render();haptic("light")}
document.querySelectorAll("[data-case]").forEach(b=>b.onclick=()=>choose(b.dataset.case));
$("#keepBtn").onclick=()=>{state.inventory.unshift(current);save();render();closePrize()};
$("#sellBtn").onclick=()=>{state.balance+=current.value;save();render();closePrize()};
$("#bonusBtn").onclick=()=>{
 const now=Date.now();if(now-state.bonus<86400000){alert("Бонус уже получен сегодня");return}
 state.balance+=5000;state.bonus=now;save();render();haptic("medium")
};
$("#soundBtn").onclick=()=>{sound=!sound;$("#soundBtn").textContent=sound?"🔊":"🔇";if(sound)beep()};
$("#sellAll").onclick=()=>{
 if(!state.inventory.length)return;
 if(confirm("Продать все номера из коллекции?")){state.balance+=state.inventory.reduce((s,x)=>s+x.value,0);state.inventory=[];save();render()}
};
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderInventory()});
render();
</script>
</body>
</html>
